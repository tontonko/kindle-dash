   name: Update dashboard

   on:
     schedule:
       - cron: "*/30 * * * *"
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Install Japanese font
           run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
         - name: Install Pillow
           run: pip install pillow
         - name: Make dashboard image
           run: python make_dashboard.py
         - name: Commit image
           run: |
             git config user.name "dashboard-bot"
             git config user.email "dashboard-bot@users.noreply.github.com"
             git add dashboard.png
             git commit -m "update dashboard" || echo "no change"
             git push
